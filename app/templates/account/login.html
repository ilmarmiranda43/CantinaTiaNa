{% extends "base.html" %}
{% block title %}Entrar — Cantina Escolar{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-5">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h1 class="h3 mb-3">Entrar</h1>
          {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
          <form method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <input type="hidden" name="return_url" value="{{ return_url }}">
            <div class="mb-3">
              <label class="form-label">E-mail</label>
              <input class="form-control" type="email" name="email" value="{{ values.get('email', '') }}" required
                autofocus>
            </div>
            <div class="mb-3">
              <label class="form-label">Senha</label>
              <input class="form-control" type="password" name="password" required>
            </div>
            <div class="form-check mb-3">
              <input class="form-check-input" type="checkbox" name="remember_me" value="true" id="remember" {% if
                values.get('remember_me') %}checked{% endif %}>
              <label class="form-check-label" for="remember">Manter conectado</label>
            </div>
            <button class="btn btn-primary w-100 py-2 fw-bold" type="submit">Entrar</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

{% endblock %}
